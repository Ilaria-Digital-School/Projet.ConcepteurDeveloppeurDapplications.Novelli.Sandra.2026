<h2>Users</h2>

<table>
    <thead>
        <tr>
            <th>#</th>
            <th>Name</th>
            <th>First name</th>
            <th>E-mail</th>
            <th colspan="3">Action</th>
        </tr>
    </thead>

    <tbody>
        @for (user of users; track user.id; let i=$index) {
        <tr>
            <th scope="row">{{user.id}}</th>
            <td [style]="applyUserStyle(user.admin)">
            @if (editId === user.id) {
                <input [(ngModel)]="user.familyName">
            }
            @else {
                {{user.familyName}}
            }
            </td>
            <td [style]="applyUserStyle(user.admin)">{{user.firstName}}</td>
            <td>{{user.email}}</td>
            <td>
                @if (editId === user.id) {
                    <button (click)="save(user)">Save</button>
                }
                @else {
                    <button (click)="editId = user.id">Edit</button>
                }
            </td>
            <td><button (click)="deleteUserById(user.id)">Delete</button></td>
            <td><button (click)="viewUserDetails(user.id)">Info</button></td>
        </tr>
        }

        @empty {
        <tr>
            <td colspan=5>There are no users to dispaly here.</td>
        </tr>
        }

    </tbody>
</table>
