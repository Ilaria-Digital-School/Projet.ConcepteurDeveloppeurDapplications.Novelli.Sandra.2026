<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cucina : let's cook together !</title>
    <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
    <header>
    <nav role="navigation" class="hidden">

        <button id="toggle-main-menu" aria-label="Menu" aria-expanded="false" aria-controls="nav1 nav2">
            <div class="line" id="l1"></div>
            <div class="line" id="l2"></div>
            <div class="line" id="l3"></div>
        </button>

        <ul id="nav1" aria-label="main menu">
            <li><button><a href="../index.html">Home</a></button></li>
            <li><button><a href="favourites.html">Favourites ❤️</a></button></li>
            <li><button><a href="contact.html" aria-current="page">Contact</a></button></li>
        </ul>
        <ul id="nav2" aria-label="sign in or login menu">
            <li><button><a href="log-in.html">Login</a></button></li>
            <li id="sign-up"><button><a href="sign-up.html">Sign up</a></button></li>
        </ul>
    </nav>
    <h1>CUCINA</h1>
    <p id="motto">Let's cook together! 🍝</p>
    </header>

    <main id="log-in-main">

    <section id="log-in-box">
    <form class="forms" id="login-form" novalidate aria-labelledby="login-heading">
        <h2 id="login-heading">Log in to your account</h2>

        <fieldset aria-labelledby="login-heading">
            <div class="info">
                <label for="email">Username/email:</label>
                <input type="email" id="email" name="email" placeholder="Enter your email" required aria-required="true" aria-describedby="login-error">
            </div>
            <div class="info">
                <label for="password">Password:</label>
                <input type="password" id="pwd" name="password" placeholder="Enter your password" required aria-required="true" aria-describedby="login-error">
            </div>
            <p class="error" id="login-error" role="alert" aria-live="polite" hidden>Invalid email or password</p>
            <button class="submit-btn" type="submit">Submit</button>
        </fieldset>

    </form>
    </section>

    <section id="sign-up-box" aria-labelledby="signup-prompt">
        <p id="sign-up-prompt">Hello there! If you haven't got an account yet, join our cooking community.</p>
        <button id="join-us-btn"><a href="sign-up.html">Sign up</a></button>
    </section>
    </main>

    <footer>
        <p>© 2026 - Cucina - Made in Plymouth, England</p>
    </footer>

    <script src="../assets/js/script.js"></script>
</body>
</html>
