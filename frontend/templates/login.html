{% extends "base.html" %}

{% block content %}

    <div id="login-main">

        <section id="login-box">
        <form class="forms" id="login-form" method="POST" aria-labelledby="login-heading">
            <h2 id="login-heading">Log in to your account</h2>

            <fieldset aria-labelledby="login-heading">
                <div class="info">
                    <label for="email">Username/email</label>
                    <input type="email" id="email" name="email" placeholder="Enter your email" required aria-required="true" aria-describedby="login-error">
                </div>
                <div class="info">
                    <label for="password">Password</label>
                    <input type="password" id="pwd" name="pwd" placeholder="Enter your password" required aria-required="true" aria-describedby="login-error">
                </div>
                <p class="error" id="login-error" role="alert" aria-live="polite" hidden>Invalid email or password</p>
                <button class="submit-btn" type="submit">Submit</button>
            </fieldset>

        </form>
        </section>

        <section id="signup-box" aria-labelledby="signup-prompt">
            <p id="signup-prompt">Hello there! If you haven't got an account yet, join our cooking community.</p>
            <button id="join-us-btn"><a href="{{ url_for('sign_up') }}">Sign up</a></button>
        </section>

    </div>

{% endblock %}
