<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cucina : let's cook together !</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

    <body>

        <header>

            <button id="toggle-main-menu" class="off" aria-label="Menu" aria-expanded="false" aria-controls="nav1 nav2">
                <div class="line" id="l1"></div>
                <div class="line" id="l2"></div>
                <div class="line" id="l3"></div>
            </button>
            
        <nav role="navigation" class="off">
                
            <ul id="nav1" aria-label="main menu">
                <li><a href="{{ url_for('index') }}">Home</a></li>
                <li><a href="{{ url_for('favourites') }}">Favourites ❤️</a></li>
                <li><a href="{{ url_for('contact') }}">Contact</a></li>
                <li><a href="{{ url_for('add_recipe') }}">Add recipe ➕</a></li>
            </ul>
            
            <p id="greetings"></p>
            
            <ul id="nav2" aria-label="sign in or login menu">
                <li id="login-link"><a href="{{ url_for('login') }}">Login</a></li>
                <li id="signup-link" class="logged-out"><a href="{{ url_for('sign_up') }}">Sign up</a></li>
                <li id="admin-link"><a href="{{ url_for('admin')}}">Admin</a></li>
                <li id="logout-link">Log out</li>
            </ul>
        </nav>
        
        <h1>CUCINA</h1>
        <p id="motto">Let's cook together! 🍝</p>
        </header>


        <main>{% block content %}{% endblock %}</main>


        <footer>
            <p>© 2026 - Cucina - Made in Plymouth, England</p>
        </footer>


    {% block scripts %}<script src="{{ url_for('static', filename='js/script.js') }}"></script>{% endblock %}
    
    </body>

</html>
