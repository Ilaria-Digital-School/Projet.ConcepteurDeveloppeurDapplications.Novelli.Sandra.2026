<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cucina : let's cook together !</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

    <header>
    <nav role="navigation" class="hidden">

        <button id="toggle-main-menu" aria-label="Menu" aria-expanded="false" aria-controls="nav1 nav2">
            <div class="line" id="l1"></div>
            <div class="line" id="l2"></div>
            <div class="line" id="l3"></div>
        </button>

        <ul id="nav1" aria-label="main menu">
            <li><button><a href="{{ url_for('index') }}">Home</a></button></li>
            <li><button><a href="{{ url_for('favourites') }}">Favourites ❤️</a></button></li>
            <li><button><a href="{{ url_for('contact') }}">Contact</a></button></li>
            <li><button><a href="{{ url_for('add_recipe') }}">Add recipe ➕</a></button></li>
        </ul>
        <ul id="nav2" aria-label="sign in or login menu">
            <li><button><a href="{{ url_for('log_in') }}">Login</a></button></li>
            <li id="sign-up"><button><a href="{{ url_for('sign_up') }}">Sign up</a></button></li>
        </ul>
    </nav>
    
    <h1>CUCINA</h1>
    <p id="motto">Let's cook together! 🍝</p>
    </header>


    <main>{% block content %}{% endblock %}</main>


    <footer>
        <p>© 2026 - Cucina - Made in Plymouth, England</p>
    </footer>


  {% block scripts %}<script src="/static/js/script.js"></script>{% endblock %}
</body>
</html>
