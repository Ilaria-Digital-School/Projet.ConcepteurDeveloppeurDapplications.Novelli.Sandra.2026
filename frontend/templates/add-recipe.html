{% extends "base.html" %}

{% block content %}


    <form class="forms" id="recipe-form">
    
    <h2>Add recipe</h2>

        <div class="info">
            <label for="recipeName" class="form-label">Recipe</label>
            <input type="text" class="form-control" id="recipeName" name="recipeName" required>
            <div class="error">This field is required</div>
        </div>
        
        <div class="info">
            <label for="img-url" class="form-label">Image URL</label>
            <input type="text" class="form-control" id="img-url" name="imgSrc">
            <div class="error">This field is required</div>
        </div>
        
        <div class="info">
            <label for="recipe-author" class="form-label">Author</label>
            <input type="text" class="form-control" id="recipe-author" name="author">
            <div class="error">This field is required</div>
        </div>
        
        <div class="info">
            <label for="recipe-type" class="form-label">Type</label>
            <select class="form-control" id="recipe-type" name="type">
                <option value="italian">Italian</option>
                <option value="french">French</option>
                <option value="meat">Meat</option>
                <option value="spicy">Spicy</option>
                <option value="sweet & sour">Sweet & sour</option>
                <option value="sashimi & sushi">Sashimi & sushi</option>
                <option value="homemade hamburgers">Homemade hamburgers</option>
                <option value="creamy dessert">Creamy dessert</option>
                <option value="cake">Cake</option>
                <option value="other">Other</option>
            </select>
            <div class="error">This field is required</div>
        </div>
        
        <div class="info">
            <label for="recipe-ingredients" class="form-label">Ingredients</label>
            <input type="text" class="form-control" id="recipe-ingredients" name="ingredients">
            <div class="error">This field is required</div>
        </div>
        
        <div class="info">
            <label for="instructions">Instructions</label>
            <textarea id="instructions" formControlName="instructions" placeholder="Type in your instructions..." required></textarea> <br>
            <div class="error">This field is required</div>
        </div>

        <button class="submit-btn" type="submit">Add</button>
    </form>

{% endblock %}
