{% extends "base.html" %}

{% block content %}


<form class="forms" id="recipe-form" aria-labelledby="add-recipe-heading">

    <h2 id="add-recipe-heading">Add recipe</h2>

    <div class="info">
        <label for="recipe-name" class="form-label">Recipe</label>
        <input type="text" class="form-control" id="recipe-name" name="recipe-name">
        <p class="error" id="recipe-name-error" role="alert" aria-live="polite" hidden></p>
    </div>

    <div class="info">
        <label for="img-url" class="form-label">Image URL</label>
        <input type="text" class="form-control" id="img-url" name="imgSrc">
        <p class="error" id="img-error" role="alert" aria-live="polite" hidden></p>
    </div>

    <div class="info">
        <label for="recipe-author" class="form-label">Author</label>
        <input type="text" class="form-control" id="recipe-author" name="author">
        <p class="error" id="author-error" role="alert" aria-live="polite" hidden></p>
    </div>

    <div class="info">
        <label for="categories" class="form-label">Category</label>
        <div class="dynamic-row category-row">
            <span class="input-and-error">
                <select class="form-control" id="categories" name="categories">
                    <option value="">Select a category...</option>
                    {% for c in recipe_categories %}
                    <option value="{{ c }}">{{ c }}</option>
                    {% endfor %}
                </select>
            <p class="error" id="category-error" role="alert" aria-live="polite" hidden></p>
            </span>
            <button type="button" class="dynamic-btn add-btn">➕</button><button type="button" class="dynamic-btn delete-btn">➖</button>
        </div>
    </div>

    <div class="info">
        <label for="preparation-time" class="form-label">Preparation time (minutes)</label>
        <input type="text" class="form-control" id="preparation-time" name="preparation-time">
        <p class="error" id="prep-time-error" role="alert" aria-live="polite" hidden></p>
    </div>

    <div class="info">
        <label for="cook-time" class="form-label">Cook time (minutes)</label>
        <input type="number" class="form-control" id="cook-time" name="cook-time">
        <p class="error" id="cook-time-error" role="alert" aria-live="polite" hidden></p>
    </div>

    <div class="info">
        <label for="servings" class="form-label">Servings</label>
        <input type="text" class="form-control" id="servings" name="servings">
        <p class="error" id="servings-error" role="alert" aria-live="polite" hidden></p>
    </div>

    <div class="info">
        <p class="form-label">Ingredients</p>
        <div class="dynamic-row ingredient-row">

                <span id="ingredient-columns">
                    <div class="ingredient-field" id="quantity-field">
                        <label for="quantity" class="small-label">Quantity</label>
                        <input type="text" class="form-control" id="quantity" name="quantity" placeholder="10...">
                    </div>
                    <div class="ingredient-field" id="unit-field">
                        <label for="unit" class="small-label">Unit</label>
                        <input type="text" class="form-control" id="unit" name="unit" placeholder="ml...">
                    </div>
                    <div class="ingredient-field" id="ingredient-field">
                        <label for="ingredient-name" class="small-label">Ingredient</label>
                        <input type="text" class="form-control" id="ingredient-name" name="ingredient-name" placeholder="nut milk...">
                        <p class="error" id="ingredient-error" role="alert" aria-live="polite" hidden></p>
                    </div>
                </span>

            <button type="button" class="dynamic-btn add-btn">➕</button><button type="button" class="dynamic-btn delete-btn">➖</button>
        </div>
    </div>

    <div class="info">
        <label for="instructions">Instructions</label>
        <div class="dynamic-row instruction-row">
            <span class="input-and-error">
                <textarea id="steps" name="steps" placeholder="Type in your instruction..."></textarea>
                <p class="error" id="step-error" role="alert" aria-live="polite" hidden></p>
            </span>
            <button type="button" class="dynamic-btn add-btn">➕</button><button type="button" class="dynamic-btn delete-btn">➖</button>
        </div>
    </div>

    <button class="submit-btn" type="submit">Add</button>
</form>

{% endblock %}
