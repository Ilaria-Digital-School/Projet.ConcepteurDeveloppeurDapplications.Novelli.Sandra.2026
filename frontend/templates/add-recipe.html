{% extends "base.html" %}

{% block content %}


    <form class="forms" id="recipe-form">
    
    <h2>Add recipe</h2>

        <div class="info">
            <label for="recipeName" class="form-label">Recipe</label>
            <input type="text" class="form-control" id="recipe-name" name="recipe-name">
            <p class="error" id="name-error" role="alert" aria-live="polite" hidden></p>
        </div>
        
        <div class="info">
            <label for="img-url" class="form-label">Image URL</label>
            <input type="text" class="form-control" id="img-url" name="imgSrc">
            <p class="error" id="name-error" role="alert" aria-live="polite" hidden></p>
        </div>
        
        <div class="info">
            <label for="recipe-author" class="form-label">Author</label>
            <input type="text" class="form-control" id="recipe-author" name="author">
            <p class="error" id="name-error" role="alert" aria-live="polite" hidden></p>
        </div>
        
        <div class="info">
            <label for="recipe-category" class="form-label">Category</label>
                <div class="dynamic-row">
                    <select class="form-control" id="recipe-category" name="categories">
                        <option value="">Select a category...</option>
                        {% for c in recipe_categories %}
                            <option value="italian">{{ c }}</option>
                        {% endfor  %}
                    </select>
                    <button class="add-btn">➕</button><button class="remove-btn">➖</button>
                </div>
            <p class="error" id="name-error" role="alert" aria-live="polite" hidden></p>
        </div>
        
        <div class="info">
            <label for="recipe-ingredients" class="form-label">Ingredients</label>
                <div class="dynamic-row">
                    <input type="text" class="form-control" id="recipe-ingredients" name="ingredients">
                    <button class="add-btn">➕</button><button class="remove-btn">➖</button>
                </div>
            <p class="error" id="name-error" role="alert" aria-live="polite" hidden></p>
        </div>
        
        <div class="info">
            <label for="instructions">Instructions</label>
                <div class="dynamic-row">
                    <textarea id="instructions" placeholder="Type in your instructions..."></textarea>
                    <button class="add-btn">➕</button><button class="remove-btn">➖</button>
                </div>
            <p class="error" id="name-error" role="alert" aria-live="polite" hidden></p>
        </div>

        <button class="submit-btn" type="submit">Add</button>
    </form>

{% endblock %}
