<div id="#log-in-main">

    <section id="log-in-box">
        <form class="forms" class="forms" id="log-in-form" [formGroup]="logInForm" (ngSubmit)="logIn()">
            <h2>Log in to your account</h2>

            <fieldset>
                <div class="info">
                    <label for="email">Username/email</label>
                    <input type="email" id="email" formControlName="email" placeholder="Enter your email" required>
                </div>
                <div class="info">
                    <label for="password">Password</label>
                    <input type="password" id="password" formControlName="pwd" placeholder="Enter your password" required>
                </div>

                @if (errorMsg) {
                    <div class="error">{{errorMsg}}</div>
                }

                <button type="submit">Submit</button>

                <div>
                    <p>Not registered yet? <a routerLink="/sign-up">Create your account</a></p>
                </div>
            </fieldset>

        </form>
    </section>

    <section id="sign-up-box" aria-labelledby="signup-prompt">
        <p id="sign-up-prompt">Hello there! If you haven't got an account yet, join our cooking community.</p>
        <button id="join-us-btn"><a href="sign-up.html">Sign up</a></button>
    </section>

</div>
