<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cucina : let's cook together !</title>
    <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
    <header>     
    <nav role="navigation">
        <ul id="nav1" aria-label="main menu">
            <li><a href="../index.html" target="_blank">Home</a></li>
            <li><a href="favourites.html" target="_blank">Favourites ❤️</a></li>
            <li><a href="contact.html" target="_blank">Contact</a></li>
        </ul>
        <ul id="nav2" aria-label="sign in or login menu">
            <li><a href="log-in.html" target="_blank">Login</a></li>
            <li id="sign-up"><a href="sign-up.html" target="_blank">Sign up</a></li>
        </ul>
    </nav>
    <h1>CUCINA</h1>
    <p id="motto">Let's cook together! 🍝</p>
    </header>

    <main id="log-in-main">

    <section id="log-in-box">
    <form class="forms">
        <h2>Log in to your account</h2>

        <fieldset>
            <div class="info">
                <label for="email">Username/email </label>
                <input type="email" id="email" placeholder="Enter your email" required>
            </div>               
            <div class="info">
                <label for="password">Password </label>
                <input type="password" id="password" placeholder="Enter your password" required>
            </div>
            <p class="error">Invalid email or password</p>           
            <button class="submit-btn" type="submit">Submit</button>
        </fieldset>

    </form>
    </section>

    <section id="sign-up-message">
        <p>Hello there! If you haven't got an account yet, join our cooking community.</p>
        <button class="submit-btn"><a href="sign-up.html">Sign up</a></button>
    </section>
    </main>

    <footer>
        <p>© 2026 - Cucina - Made in Plymouth, England</p>
    </footer>

    <script src="../assets/js/script.js"></script>
</body>
</html>
