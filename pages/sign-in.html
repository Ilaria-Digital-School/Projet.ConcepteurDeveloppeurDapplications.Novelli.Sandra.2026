<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cucina : let's cook together !</title>
    <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
    <header>     
    <nav>
        <ul id="nav1">
            <a href="../index.html" target="_blank"><li>Home</li></a>
            <a href="favourites.html" target="_blank"><li>Favourites ❤️</li></a>
            <a href="contact.html" target="_blank"><li>Contact</li></a>
        </ul>
        <ul id="nav2">
            <a href="sign-in.html" target="_blank"><li>Sign in</li></a>
            <a href="sign-up.html" target="_blank"><li id="sign-up">Sign up</li></a>
        </ul>
    </nav>
    <h1>CUCINA</h1>
    <p id="motto">Let's cook together! 🍝</p>
    </header>

    <main id="sign-in-main">

    <section id="sign-in-box">
    <form>
        <h2>Log in to your account</h2>

        <fieldset>
            <div class="info">
                <label for="email">Username/email </label>
                <input type="email" id="email" placeholder="Enter your email" required>
            </div>               
            <div class="info">
                <label for="password">Password </label>
                <input type="password" id="password" placeholder="Enter your password" required>
            </div>               

            <button type="submit">Submit</button>

        </fieldset>

    </form>
    </section>

    <section id="sign-up-message">
        <p>Hello there! If you haven't got an account yet, join our cooking community.</p>
        <button><a href="sign-up.html">Sign up</a></button>
    </section>
    </main>

    <footer>
        <p>© 2026 - Cucina - Made in Plymouth, England</p>
    </footer>

    <script src="../assets/js/script.js"></script>
</body>
</html>
