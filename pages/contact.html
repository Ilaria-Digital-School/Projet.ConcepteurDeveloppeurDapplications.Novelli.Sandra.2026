<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cucina : let's cook together !</title>
    <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
    <header>     
    <nav>
        <ul id="nav1">
            <a href="../index.html" target="_blank"><li>Home</li></a>
            <a href="favourites.html" target="_blank"><li>Favourites ❤️</li></a>
            <a href="contact.html" target="_blank"><li>Contact</li></a>
        </ul>
        <ul id="nav2">

            <a href="sign-up.html" target="_blank"><li id="sign-up">Sign up</li></a>
        </ul>
    </nav>
    <h1>CUCINA</h1>
    <p id="motto">Let's cook together! 🍝</p>
    </header>

    <main>
    
    <form class="forms">
    <h2>Contact us</h2>

    <div class="info">
        <label for="name">Name:</label>
        <input type="text" id="name" placeholder="Enter your name" required>
        <p class="error">This field is required</p>
    </div>
    <div class="info">
        <label for="email">Email:</label>
        <input type="email" id="email" formControlName="email" placeholder="exemple@email.com" required>
        <p class="error">This field is required</p>
    </div>
    <div class="info">
        <label for="form-msg">Message:</label>
        <textarea placeholder="Type your message" required></textarea>
        <p class="error">This field is required</p>
    </div>
    <div>
        <button class="submit-btn" type="submit">Submit</button>
    </div>
</form>


    </main>

    <footer>
        <p>© 2026 - Cucina - Made in Plymouth, England</p>
    </footer>

    <script src="../assets/js/script.js"></script>
</body>
</html>
