<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cucina : let's cook together !</title>
    <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
    <header>
    <nav role="navigation">
        <ul id="nav1" aria-label="main menu">
            <li><button><a href="../index.html">Home</a></button></li>
            <li><button><a href="favourites.html">Favourites ❤️</a></button></li>
            <li><button><a href="contact.html" aria-current="page">Contact</a></button></li>
        </ul>
        <ul id="nav2" aria-label="sign in or login menu">
            <li><button><a href="log-in.html">Login</a></button></li>
            <li id="sign-up"><button><a href="sign-up.html">Sign up</a></button></li>
        </ul>
    </nav>
    <h1>CUCINA</h1>
    <p id="motto">Let's cook together! 🍝</p>
    </header>

    <main>

    <form class="forms" id="contact-form" novalidate aria-labelledby="contact-heading">
        <h2 id="contact-heading">Contact us</h2>

        <div class="info">
            <label for="name">Name:</label>
            <input type="text" id="name" name="name" data-label="Name" placeholder="Enter your name" required aria-required="true" aria-describedby="name-error">
            <p class="error" id="name-error" role="alert" aria-live="polite" hidden>This field is required</p>
        </div>
        <div class="info">
            <label for="email">Email:</label>
            <input type="email" id="email" name="email" data-label="Email" placeholder="exemple@email.com" required aria-required="true" aria-describedby="email-error">
            <p class="error" id="email-error" role="alert" aria-live="polite" hidden>This field is required</p>
        </div>
        <div class="info">
            <label for="form-msg">Message:</label>
            <textarea id="form-msg" name="message" data-label="Message" placeholder="Type your message" required aria-required="true" aria-describedby="msg-error"></textarea>
            <p class="error" id="msg-error" role="alert" aria-live="polite" hidden>This field is required</p>
        </div>
        <div>
            <button class="submit-btn" type="submit">Submit</button>
        </div>
    </form>

    </main>

    <footer>
        <p>© 2026 - Cucina - Made in Plymouth, England</p>
    </footer>

    <script src="../assets/js/script.js"></script>
</body>
</html>
